          - '423'
          - '424'
          - '426'
          - '428'
          - '429'
          - '431'
          - '500'
          - '501'
          - '502'
          - '503'
          - '504'
          - '505'
          - '506'
          - '507'
          - '508'
          - '509'
          - '510'
          - '511'
    CustomField:
      type: object
      properties:
        dataType:
          type: string
          description: Data type of the custom field.
        definitionID:
          type: integer
          format: int64
          description: Id of the custom field definition.
        fieldName:
          type: string
          description: Name of the custom field.
        value:
          type: string
          description: Value of the custom field.
      description: Custom field.
    RESTAPIError:
      type: object
      properties:
        key:
          type: string
        message:
          type: string
    SaveVendor:
      type: object
      required:
      - companyName
      - name
      - nameOnCheck
      - vendorType
      properties:
        accountNumber:
          type: string
          description: Account Number
        address:
          type: string
          description: Address
        address2:
          type: string
          description: Address2
        alertEmail:
          type: string
          description: Alert Email
        city:
          type: string
          description: City
        companyName:
          type: string
