          enum:
          - 0
          - 5
          - 10
          - 15
          - 30
          - 45
          - 60
          - 90
        defaultBillSplitAccountId:
          type: integer
          format: int64
          description: Default bill split id
        defaultMarkupDiscountPercentage:
          type: number
          format: double
          description: Default markup discount
        description:
          type: string
          description: Description
        eligible1099:
          type: boolean
          example: false
          description: Eligible For 1099
        email:
          type: string
          description: EMail
        fax:
          type: string
          description: Fax
        includeCompanyNameOn1099:
          type: boolean
          example: false
          description: Include company name on 1099
        markupAccountId:
          type: integer
          format: int64
          description: Markup account id
