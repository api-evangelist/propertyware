    RESTAPIBulkSuccessResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
    Prospect:
      type: object
      properties:
        applicationFeePaid:
          type: boolean
          example: false
          description: Indicates if the application fee has been paid by the prospect.
        assigneFullName:
          type: string
          description: Name of the assigned prospect.
        buildingID:
          type: integer
          format: int64
          description: Id of the building associated with the prospect.
        cityDesired:
          type: string
