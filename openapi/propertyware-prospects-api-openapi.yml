    post:
      tags:
      - Prospects
      summary: Create a prospect conversation
      description: 'Creates a specific prospect conversation.


        Required permission:

        PROSPECTS - Write'
      operationId: createProspectConversation
      parameters:
      - name: prospectID
        in: path
        description: Prospect ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: '#/components/requestBodies/SaveConversation'
      responses:
        '201':
