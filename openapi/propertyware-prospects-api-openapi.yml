components:
  schemas:
    SaveCustomField:
      type: object
      required:
      - entityId
      - fieldSet
      properties:
        entityId:
          type: integer
          format: int64
          description: Unique identifier of an entity custom field associated to.
        fieldSet:
          type: array
          description: List of Custom fields to update
          items:
            $ref: '#/components/schemas/CustomFieldSet'
      description: Custom field for Request
    CustomFieldSet:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Custom Field name
        value:
          type: string
          description: Custom Field value
      description: Custom field set for Request
    SaveProspectContact:
      type: object
      required:
      - firstName
      - lastName
      properties:
        address:
          $ref: '#/components/schemas/SaveAddress'
        email:
          type: string
          description: ' EMail.'
        firstName:
          type: string
          description: First Name.
        homePhone:
          type: string
          description: ' Home Phone.'
        id:
          type: integer
          format: int64
          description: Unique identifier.
        lastName:
          type: string
          description: ' Last Name.'
        mobilePhone:
          type: string
          description: ' Mobile Phone.'
        otherPhone:
          type: string
          description: ' Other Phone.'
        percentageship:
          type: number
          format: double
          description: ship percentage.
        workPhone:
          type: string
          description: ' Work Phone.'
      description: Save Prospect Contact
    Conversation:
      type: object
      properties:
        comments:
          type: array
          description: List of comments in the conversation.
          items:
            $ref: '#/components/schemas/Comment'
        createdBy:
          type: string
          description: User who created the record.
        createdDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was created. (Timezone: UTC)'
        entityID:
          type: integer
          format: int64
          description: Id of the entity related to this conversation.
        entityType:
          type: string
          description: Type of the entity related to this conversation.
        id:
          type: integer
          format: int64
          description: Unique identifier.
        lastModifiedBy:
          type: string
          description: User who last modified the record.
        lastModifiedDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was last modified. (Timezone: UTC)'
        subject:
          type: string
          description: Conversation subject.
        type:
          type: string
          description: Conversation type.
          enum:
          - MANAGEMENT_TEAM
          - OWNER
          - TENANT
      description: Conversation
    CampaignSource:
      type: object
      properties:
        callTrackingGroupID:
          type: string
          description: Call tracking group id.
        default:
          type: boolean
        id:
          type: integer
          format: int64
          description: Unique identifier.
        name:
          type: string
          description: Name of the campaign source.
        referrerDomain:
          type: string
          description: Referrer domain.
      description: CampaignSource
    SaveConversation:
      type: object
      required:
      - text
      - type
      properties:
        text:
          type: string
          description: Comment text.
        type:
          type: string
          description: Conversation type.
          enum:
          - MANAGEMENT_TEAM
          - OWNER
          - TENANT
      description: Conversation for Request
    RESTAPIError:
      type: object
      properties:
        key:
          type: string
        message:
          type: string
    ProspectStatus:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier.
        readonly:
          type: boolean
          example: false
          description: Read Only
        status:
          type: string
          description: Status
        visibleOnPortal:
          type: boolean
          example: false
          description: Status visible On Portal
      description: Prospect Status
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RESTAPIError'
        userMessage:
          type: string
