                  $ref: '#/components/schemas/ProspectStatus'
        '400':
          description: Unable to process the request due to malformed request syntax or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The API key couldn't be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The supplied credentials don't have permissions to access the resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entity not found.
  /prospects/{prospectID}:
    get:
      tags:
      - Prospects
      summary: Retrieve a prospect
      description: 'Retrieves a specific prospect.


        Required permission:

        PROSPECTS - Read'
      operationId: getProspect
      parameters:
      - name: prospectID
        in: path
        description: Prospect ID
        required: true
        schema:
          type: integer
          format: int64
      - name: includeCustomFields
        in: query
        description: includeCustomFields
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prospect'
        '400':
          description: Unable to process the request due to malformed request syntax or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The API key couldn't be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The supplied credentials don't have permissions to access the resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entity not found.
  /prospects/{prospectID}/campaign:
    get:
      tags:
      - Prospects
      summary: Retrieve prospect campaign
      description: 'Retrieves the campaign details of a prospect.


        Required permission:

        PROSPECTS - Read'
      operationId: getProspectCampaign
      parameters:
      - name: prospectID
        in: path
        description: Prospect ID
        required: true
        schema:
          type: integer
