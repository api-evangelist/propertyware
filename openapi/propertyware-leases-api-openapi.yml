openapi: 3.2.0
info:
  description: "\uFEFF\n\n# Introduction\n\nWelcome to Propertyware’s API—a powerful, RESTful programming interface that lets you leverage valuable Propertyware data."
  version: '1.0'
  title: Open API, powered by Propertyware Leases API
  contact:
    name: Propertyware
    email: support@propertyware.com
  x-logo:
    url: logo.png
    backgroundColor: '#fff'
    altText: Propertyware, A RealPage Company
    href: https://www.propertyware.com
servers:
- url: https://api.propertyware.com/pw/api/rest/v1
security:
- clientId: []
- clientSecret: []
- organizationId: []
tags:
- name: Leases
  description: Resources providing access to rental property leases.
paths:
  /leases:
    get:
      tags:
      - Leases
      summary: Retrieve all leases
      description: 'Retrieves a list of leases.


        Required permission:

        LEASES - Read


        Sortable by: startdate, idnumber, scheduledmoveoutdate, enddate, lastmodifieddatetime, status, moveoutdate, id, moveindate'
      operationId: getLeases
      parameters:
      - name: offset
        in: query
        description: '`offset` indicates the position of the first record to return. The offset is zero-based and the default is 0.'
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: '`limit` indicates the maximum number of results to be returned in the response. `limit` can range between 1 and 500 and the default is 100.'
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: lastModifiedDateTimeStart
        in: query
        description: 'Filters results to any item modified on or after the date time specified. '
        required: false
        schema:
          type: string
          format: date-time
      - name: lastModifiedDateTimeEnd
        in: query
        description: 'Filters results to any item modified on or prior to the date time specified. '
        required: false
        schema:
          type: string
          format: date-time
      - name: orderby
        in: query
        description: Indicates the field(s) and direction to sort the results in the response.
        required: false
        schema:
          type: string
      - name: startDateStart
        in: query
        description: Filters results to any lease with a start date on or after the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: startDateEnd
        in: query
        description: Filters results to any lease with a start date on or prior to the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: endDateStart
        in: query
        description: Filters results to any lease with a end date on or after the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: endDateEnd
        in: query
        description: Filters results to any lease with a end date on or prior to the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: moveInDateStart
        in: query
        description: Filters results to any lease with a move-in date on or after the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: moveInDateEnd
        in: query
        description: Filters results to any lease with a move-in date on or prior to the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: scheduleMoveOutDateStart
        in: query
        description: Filters results to any lease with a move-out date on or after the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: scheduleMoveOutDateEnd
        in: query
        description: Filters results to any lease with a move-out date on or prior to the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: portfolioID
        in: query
        description: Filters results to leases associated with a specific portfolio.
        required: false
        schema:
          type: integer
          format: int64
      - name: buildingID
        in: query
        description: Filters results to leases associated with a specific building.
        required: false
        schema:
          type: integer
          format: int64
      - name: unitID
        in: query
        description: Filters results to leases associated with a specific unit.
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        description: Filters results to inspections with a specific status.
        required: false
        schema:
          type: string
      - name: includeCustomFields
        in: query
        description: includeCustomFields
        required: false
        schema:
          type: boolean
          default: false
      - name: includeOtherBalances
        in: query
        description: includeOtherBalances
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: The total resultset count
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lease'
        '400':
          description: Unable to process the request due to malformed request syntax or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The API key couldn't be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The supplied credentials don't have permissions to access the resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Leases
      summary: Create a lease
      description: 'Creates a new lease.


        Required permission:

        LEASES - Write'
      operationId: createLease
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLease'
        description: saveLease
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '400':
          description: Unable to process the request due to malformed request syntax or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The API key couldn't be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The supplied credentials don't have permissions to access the resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entity not found.
