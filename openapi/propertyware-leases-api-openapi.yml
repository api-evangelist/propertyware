components:
  schemas:
    SaveAdjustment:
      type: object
      required:
      - amount
      - leaseID
      properties:
        amount:
          type: number
          format: double
          description: Amount, should be negative.
        comments:
          type: string
          description: Comments.
        date:
          type: string
          format: date
          description: Lease Adjustment date.
        leaseID:
          type: integer
          format: int64
          description: Id of the lease associated with the Adjustment.
        refNo:
          type: string
          description: Reference number.
      description: Adjustment for Request
    Collection_long_:
      type: object
    ContactExtension:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        allowESignature:
