openapi: 3.2.0
info:
  description: "\uFEFF\n\n# Introduction\n\nWelcome to Propertyware’s API—a powerful, RESTful programming interface that lets you leverage valuable Propertyware data."
  version: '1.0'
  title: Open API, powered by Propertyware Work orders API
  contact:
    name: Propertyware
    email: support@propertyware.com
  x-logo:
    url: logo.png
    backgroundColor: '#fff'
    altText: Propertyware, A RealPage Company
    href: https://www.propertyware.com
servers:
- url: https://api.propertyware.com/pw/api/rest/v1
security:
- clientId: []
- clientSecret: []
- organizationId: []
tags:
- name: Work Orders
  description: Resources providing access to work orders.
paths:
  /workorders:
    get:
      tags:
      - Work Orders
      summary: Retrieve all work orders
      description: 'Retrieves a list of work orders.


        Required permission:

        WORK ORDERS - Read


        Sortable by: createddate, number, type, lastmodifieddatetime, status, id'
      operationId: getWorkOrders
      parameters:
      - name: offset
        in: query
        description: '`offset` indicates the position of the first record to return. The offset is zero-based and the default is 0.'
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: '`limit` indicates the maximum number of results to be returned in the response. `limit` can range between 1 and 500 and the default is 100.'
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: lastModifiedDateTimeStart
        in: query
        description: 'Filters results to any item modified on or after the date time specified. '
        required: false
        schema:
          type: string
          format: date-time
      - name: lastModifiedDateTimeEnd
        in: query
        description: 'Filters results to any item modified on or prior to the date time specified. '
        required: false
        schema:
          type: string
          format: date-time
      - name: orderby
        in: query
        description: Indicates the field(s) and direction to sort the results in the response.
        required: false
        schema:
          type: string
      - name: portfolioID
        in: query
        description: Filters results to prospects associated with a specific portfolio.
        required: false
        schema:
          type: integer
          format: int64
      - name: buildingID
        in: query
        description: Filters results to prospects associated with a specific building.
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        description: Filters results to work orders with a specific status.
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: Filters results to work orders with a specific type.
        required: false
        schema:
          type: string
      - name: priority
        in: query
        description: Filters results to work orders with a specific priority.
        required: false
        schema:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
      - name: completedDateStart
        in: query
        description: Filters results to any payment with a date on or after to the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: completedDateEnd
        in: query
        description: Filters results to any payment with a date on or prior to the date specified.
        required: false
        schema:
          type: string
          format: date
      - name: includeCustomFields
        in: query
        description: includeCustomFields
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: The total resultset count
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Unable to process the request due to malformed request syntax or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The API key couldn't be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The supplied credentials don't have permissions to access the resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Work Orders
      summary: Create a work order
      description: 'Creates a work order.


        Required permission:

        WORK ORDERS - Write'
      operationId: createWorkOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkOrder'
        description: saveWorkOrder
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Unable to process the request due to malformed request syntax or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The API key couldn't be authorized.
          content:
            application/json:
              schema:
