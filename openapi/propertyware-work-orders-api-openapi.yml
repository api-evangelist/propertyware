components:
  schemas:
    Collection_long_:
      type: object
    SaveCustomField:
      type: object
      required:
      - entityId
      - fieldSet
      properties:
        entityId:
          type: integer
          format: int64
          description: Unique identifier of an entity custom field associated to.
        fieldSet:
          type: array
          description: List of Custom fields to update
          items:
            $ref: '#/components/schemas/CustomFieldSet'
      description: Custom field for Request
    BasicVendor:
      type: object
      properties:
        address:
          type: string
          description: Address.
        createdBy:
          type: string
          description: User who created the record.
        createdDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was created. (Timezone: UTC)'
        customFields:
          type: array
          description: Custom fields.
          items:
            $ref: '#/components/schemas/CustomField'
        email:
          type: string
          description: Email address.
        fax:
          type: string
          description: Fax number.
        id:
          type: integer
          format: int64
          description: Unique identifier.
        lastModifiedBy:
          type: string
          description: User who last modified the record.
        lastModifiedDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was last modified. (Timezone: UTC)'
        name:
          type: string
          description: Name.
        otherPhone:
          type: string
          description: Other phone number.
        phone:
          type: string
          description: Phone number.
    Task:
      type: object
      properties:
        completed:
          type: boolean
          example: false
          description: Indicates if the task has been completed.
        completedTime:
          type: string
          format: date-time
          description: Time at which the task was completed.
        createdBy:
          type: string
          description: User who created the record.
        createdDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was created. (Timezone: UTC)'
        delegates:
          type: string
          description: Comma separated IDs of users to whom the task has been delegated.
        description:
          type: string
          description: Description of the task.
        dueDate:
          type: string
          format: date
          description: Date the task is due.
        id:
          type: integer
          format: int64
          description: Unique identifier.
        lastModifiedBy:
          type: string
          description: User who last modified the record.
        lastModifiedDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was last modified. (Timezone: UTC)'
        privateTask:
          type: boolean
          example: false
          description: Indicates if the task is private.
        starred:
          type: boolean
          example: false
          description: Indicates if the task has been marked with a star.
        tags:
          type: string
          description: List of tags associated with the task.
      description: Task
    CustomFieldSet:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Custom Field name
        value:
          type: string
          description: Custom Field value
      description: Custom field set for Request
    WorkOrder:
      type: object
      properties:
        age:
          type: integer
          format: int64
          description: Number of days that have passed since the work order was created.
        approved:
          type: boolean
          example: false
          description: Indicates if work order is approved.
        approvedDate:
          type: string
          format: date
          description: Work order approved Date.
        assignedVendors:
          type: array
          description: List of vendors attached to the work order.
          items:
            $ref: '#/components/schemas/BasicVendor'
        authorizeEnter:
          type: string
          description: Indicates if the tenant has granted your management staff access to enter his or her buildings and/or units.
          enum:
          - 'NO'
          - ANYTIME
          - SPECIFIEDTIME
        buildingID:
          type: integer
          format: int64
          description: Id of the building associated with this work order.
        category:
          type: string
          description: This classifies the work order into a category.
        completedDate:
          type: string
          format: date
          description: Date on which the work was completed.
        contractNumber:
          type: string
          description: Contract number.
        costEstimate:
          type: number
          format: double
          description: This indicates the estimated cost as entered by a person, the actual cost as determined by the work order bills, and the invoiced amount is the amount the owner will see on his or her statement based on the bill and markup/discount amount.
        createdBy:
          type: string
          description: User who created the record.
        createdDateTime:
          type: string
          format: date-time
          description: 'Date and time the record was created. (Timezone: UTC)'
        customFields:
          type: array
          description: Custom fields.
          items:
            $ref: '#/components/schemas/CustomField'
        dateToEnter:
          type: string
          format: date-time
          description: Authorized date to enter unit.
        description:
          type: string
          description: This is a detailed description of the problem.
        hourEstimate:
